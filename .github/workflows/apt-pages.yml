name: Protected apt Pages promotion
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful cercano-ai/Cercano release-macos.yml run ID
        required: true
        type: string
      source_sha:
        description: Reviewed full main commit SHA of that run
        required: true
        type: string
      source_artifact_id:
        description: Exact linux-packages-review artifact ID from that run
        required: true
        type: string
      artifact_sha256:
        description: SHA256 digest of artifact ZIP (must match Actions API digest)
        required: true
        type: string
      version:
        description: Exact package version (without v)
        required: true
        type: string
      expected_base:
        description: Latest published apt-snapshot tag, or EMPTY for reviewed first deployment
        required: true
        type: string
permissions: {}
# Workflow-level lock includes approvals, storage, Pages and receipt. Do not rename.
concurrency:
  group: apt-production
  cancel-in-progress: false
jobs:
  guard:
    if: github.repository == 'cercano-ai/packages' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      image: ${{ steps.guard.outputs.image }}
    steps:
      - id: guard
        name: Require reviewed immutable toolchain and real-package acceptance
        shell: bash
        env:
          IMAGE: ${{ vars.APT_TOOLCHAIN_IMAGE }}
          ACCEPTED: ${{ vars.APT_REAL_PACKAGE_ACCEPTED }}
        run: |
          [[ "$IMAGE" =~ ^ghcr.io/cercano-ai/apt-toolchain@sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCEPTED" == reviewed ]]
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
  prepare:
    needs: guard
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.guard.outputs.image }}
    environment: apt-production
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      candidate_sha256: ${{ steps.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate source, restore pool, sign and construct candidate
        id: prepare
        run: python3 scripts/apt.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.expected_base }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          VERSION: ${{ inputs.version }}
          SOURCE_ACTIONS_READ_TOKEN: ${{ secrets.SOURCE_ACTIONS_READ_TOKEN }}
          APT_SIGNING_SUBKEY_B64: ${{ secrets.APT_SIGNING_SUBKEY_B64 }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_PRIMARY_FINGERPRINT: ${{ vars.APT_PRIMARY_FINGERPRINT }}
          APT_SIGNING_SUBKEY_FINGERPRINT: ${{ vars.APT_SIGNING_SUBKEY_FINGERPRINT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apt-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/
          retention-days: 7
  retain:
    needs: [guard, prepare]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.guard.outputs.image }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apt-candidate
          path: candidate/
      - name: Recheck base, retain candidate and read it back before Pages
        run: python3 scripts/apt.py retain
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.expected_base }}
          CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
  deploy:
    needs: retain
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish retained candidate
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  finalize:
    needs: [guard, prepare, deploy]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.guard.outputs.image }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record successful deployment (failure blocks all subsequent promotions)
        run: python3 scripts/apt.py finalize
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
